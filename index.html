<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<title>Ink Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="nav">
    <button id="prev" class="icon" aria-label="Previous">‹</button>
    <h1 id="title"></h1>
    <button id="next" class="icon" aria-label="Next">›</button>
  </div>
  <nav id="views">
    <button id="todayBtn" class="today"></button>
    <a data-v="month" href="#/month"></a><a data-v="week" href="#/week"></a><a data-v="day" href="#/day"></a>
    <a data-v="notes" href="#/notes"></a><a data-v="col" href="#/col"></a><a data-v="search" href="#/search"></a>
    <button id="settingsBtn" class="icon" aria-label="Settings">⚙</button>
  </nav>
  <div id="subnav"></div>
</header>
<div id="tools" class="tools" hidden>
  <button data-tool="pen" data-label="pen">✒</button>
  <button data-tool="draw" data-label="drawTool">🖌</button>
  <button data-tool="marker" data-label="marker">🖍</button>
  <button data-tool="eraser" data-label="eraser">⌫</button>
  <button id="penStyle" data-label="penStyle"><span class="swatch"></span></button>
  <button id="undo" data-label="undo">↶</button>
  <button id="redo" data-label="redo">↷</button>
  <button id="convert" data-label="convert">Aa</button>
  <button id="penOnly" data-label="penOnly">✋</button>
</div>
<main id="main"></main>
<dialog id="settings"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
